<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Goldendale Scorecard</title>
  <link rel="stylesheet" href="css/styles.css?v=20260826y">
  <script>
  (function () {
    var KEY = 'goldendale_scorecard_token';
    function token() {
      try { return localStorage.getItem(KEY); } catch (e) { return null; }
    }
    function headers() {
      var h = { 'Content-Type': 'application/json' };
      var t = token();
      if (t) h.Authorization = 'Bearer ' + t;
      return h;
    }
    function parse(res) {
      if (res.status === 304) return { notModified: true };
      return res.json().catch(function () { return {}; }).then(function (data) {
        if (!res.ok) throw new Error(data.error || data.message || ('HTTP ' + res.status));
        return data;
      });
    }
    function rawGet(path) {
      return fetch(path, { method: 'GET', headers: headers() }).then(parse);
    }
    function rawPost(path, body) {
      return fetch(path, { method: 'POST', headers: headers(), body: JSON.stringify(body || {}) }).then(parse);
    }
    function rawPut(path, body) {
      return fetch(path, { method: 'PUT', headers: headers(), body: JSON.stringify(body || {}) }).then(parse);
    }
    function rawDel(path) {
      return fetch(path, { method: 'DELETE', headers: headers() }).then(parse);
    }
    function rawGetLive(path, updatedAt) {
      var url = path;
      var h = headers();
      if (updatedAt) {
        h['If-None-Match'] = '"' + updatedAt + '"';
        url += (path.indexOf('?') >= 0 ? '&' : '?') + 'since=' + encodeURIComponent(updatedAt);
      }
      return fetch(url, { method: 'GET', headers: h }).then(parse);
    }
    function attach(api) {
      if (!api || typeof api !== 'object') api = {};
      if (typeof api.get !== 'function') api.get = rawGet;
      if (typeof api.post !== 'function') api.post = rawPost;
      if (typeof api.put !== 'function') api.put = rawPut;
      if (typeof api.del !== 'function') api.del = rawDel;
      if (typeof api.getLive !== 'function') api.getLive = rawGetLive;
      if (typeof api.postScore !== 'function') api.postScore = rawPost;
      if (typeof api.setToken !== 'function') api.setToken = function (t) { try { localStorage.setItem(KEY, t); } catch (e) {} };
      if (typeof api.getToken !== 'function') api.getToken = token;
      if (typeof api.clearToken !== 'function') api.clearToken = function () { try { localStorage.removeItem(KEY); } catch (e) {} };
      if (typeof api.updateBadge !== 'function') api.updateBadge = function () {};
      if (typeof api.flushInBackground !== 'function') api.flushInBackground = function () {};
      return api;
    }
    function apiClient() {
      window.api = attach(window.api);
      return window.api;
    }
    function callApi(method) {
      var args = Array.prototype.slice.call(arguments, 1);
      var client = apiClient();
      if (client && typeof client[method] === 'function') return client[method].apply(client, args);
      if (method === 'get') return rawGet(args[0]);
      if (method === 'post' || method === 'postScore') return rawPost(args[0], args[1]);
      if (method === 'put') return rawPut(args[0], args[1]);
      if (method === 'del') return rawDel(args[0]);
      if (method === 'getLive') return rawGetLive(args[0], args[1]);
      if (method === 'getToken') return token();
      if (method === 'setToken') { try { localStorage.setItem(KEY, args[0]); } catch (e) {} return; }
      if (method === 'clearToken') { try { localStorage.removeItem(KEY); } catch (e) {} return; }
      if (method === 'updateBadge' || method === 'flushInBackground') return;
      return rawGet(args[0]);
    }
    window.rawGet = rawGet;
    window.rawPost = rawPost;
    window.rawPut = rawPut;
    window.rawDel = rawDel;
    window.rawGetLive = rawGetLive;
    window.attachApiHelpers = attach;
    window.apiClient = apiClient;
    window.callApi = callApi;
    window.api = attach(window.api);
  })();
  </script>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="#dashboard" class="brand-link">
          <span class="brand-title">Goldendale Scorecard</span>
          <span class="brand-subtitle">1901 N Columbus Ave</span>
        </a>
      </div>

      <nav class="nav" id="main-nav">
        <a href="#dashboard" class="nav-link active" data-route="dashboard">Rounds</a>
        <a href="#create" class="nav-link" data-route="create">New Round</a>
        <a href="#courses" class="nav-link admin-only" data-route="courses" style="display:none">Courses</a>
        <a href="#profile" class="nav-link" data-route="profile">Profile</a>
        <a href="#rules" class="nav-link" data-route="rules">Game Rules</a>
      </nav>

      <div class="header-actions">
        <span class="unsynced-badge" id="unsynced-badge" hidden>Unsynced 0</span>
        <button class="btn btn-accent btn-sm" id="login-btn">Sign In</button>
        <div class="user-menu" id="user-menu" style="display:none">
          <span class="user-name" id="user-name"></span>
          <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
        </div>
      </div>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="container" id="app"></div>
  </main>

  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Goldendale Scorecard</h2>
        <p class="modal-subtitle">Goldendale Golf Club · WA 98620</p>
        <div class="modal-tabs">
          <button class="modal-tab active" id="tab-login" data-tab="login">Sign In</button>
          <button class="modal-tab" id="tab-register" data-tab="register">Register</button>
          <button class="modal-tab" id="tab-magic" data-tab="magic">Magic link</button>
        </div>
      </div>

      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
        <button type="button" class="btn btn-secondary btn-block" id="forgot-btn">Forgot password</button>
      </form>

      <form class="auth-form" id="register-form" style="display:none">
        <div class="form-group">
          <label for="register-name">Display name</label>
          <input type="text" id="register-name" class="form-input" placeholder="Your name" required>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="form-input" placeholder="Create a password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="register-handicap">Handicap index (optional)</label>
          <input type="text" id="register-handicap" class="form-input" placeholder="12.4 or +2">
        </div>
        <div class="form-group">
          <label for="register-tee">Home tee (optional)</label>
          <input type="text" id="register-tee" class="form-input" placeholder="White/Blue">
        </div>
        <div class="form-error" id="register-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>

      <form class="auth-form" id="magic-form" style="display:none">
        <p class="modal-help">We'll create a one-time sign-in link. Email delivery is not configured in this deploy — the link is shown so you can open it.</p>
        <div class="form-group">
          <label for="magic-email">Email</label>
          <input type="email" id="magic-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-error" id="magic-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Get magic link</button>
        <div id="magic-result" class="auth-result"></div>
      </form>

      <form class="auth-form" id="forgot-form" style="display:none">
        <div class="form-group">
          <label for="forgot-email">Email</label>
          <input type="email" id="forgot-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-error" id="forgot-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Create reset link</button>
        <div id="forgot-result" class="auth-result"></div>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="app-form-modal">
    <div class="modal">
      <button class="modal-close" id="app-form-close" aria-label="Close">&times;</button>
      <div class="modal-header">
        <h2 class="modal-title" id="app-form-title">Enter details</h2>
      </div>
      <form class="auth-form" id="app-form">
        <div id="app-form-fields"></div>
        <div class="form-error" id="app-form-error"></div>
        <button type="submit" class="btn btn-primary btn-block" id="app-form-submit">Save</button>
        <button type="button" class="btn btn-secondary btn-block" id="app-form-cancel">Cancel</button>
      </form>
    </div>
  </div>

  <script src="js/vsPar.js?v=20260826y"></script>
  <script src="js/formats.js?v=20260826y"></script>
  <script src="js/sideGames.js?v=20260826y"></script>
  <script src="js/api.js?v=20260826y"></script>
  <script src="js/auth.js?v=20260826y"></script>
  <script src="js/dashboard.js?v=20260826y"></script>
  <script src="js/wyrmCoil.js?v=20260826y"></script>
  <script src="js/scorecard.js?v=20260826y"></script>
  <script src="js/leaderboard.js?v=20260826y"></script>
  <script src="js/app.js?v=20260826y"></script>

</body>
</html>
