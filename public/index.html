<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandon Dunes Retreat | Match Play Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== HEADER / NAVIGATION ===== -->
  <header class="header">
    <div class="header-inner">
      <div class="header-brand">
        <a href="#dashboard" class="brand-link">
          <svg class="brand-logo" viewBox="0 0 40 40" width="36" height="36" aria-hidden="true">
            <!-- Shaft -->
            <line x1="20" y1="4" x2="20" y2="30" stroke="#d4d4d4" stroke-width="2.2" stroke-linecap="round"/>
            <!-- Grip wrapping -->
            <line x1="18.5" y1="5" x2="21.5" y2="7" stroke="#888" stroke-width="0.8"/>
            <line x1="18.5" y1="8" x2="21.5" y2="10" stroke="#888" stroke-width="0.8"/>
            <line x1="18.5" y1="11" x2="21.5" y2="13" stroke="#888" stroke-width="0.8"/>
            <!-- Club head (iron) -->
            <path d="M14 30 L20 30 L22 31 L22 36 L18 37 L14 36 Z" fill="#b0b0b0" stroke="#888" stroke-width="0.6"/>
            <!-- Hosel connection -->
            <rect x="19" y="28" width="2.5" height="3" rx="0.5" fill="#999"/>
            <!-- Club face line -->
            <line x1="15" y1="32" x2="21" y2="32" stroke="#777" stroke-width="0.5"/>
            <line x1="15" y1="33.5" x2="21" y2="33.5" stroke="#777" stroke-width="0.5"/>
            <line x1="15" y1="35" x2="21" y2="35" stroke="#777" stroke-width="0.5"/>
          </svg>
          <div class="brand-text">
            <span class="brand-title">Bandon Dunes Retreat</span>
            <span class="brand-subtitle">Match Play Championship</span>
          </div>
        </a>
      </div>

      <nav class="nav" id="main-nav">
        <a href="#dashboard" class="nav-link active" data-route="dashboard">Dashboard</a>
        <a href="#rounds" class="nav-link" data-route="rounds">Rounds</a>
        <a href="#leaderboard" class="nav-link" data-route="leaderboard">Leaderboard</a>
        <a href="#players" class="nav-link" data-route="players">Players</a>
      </nav>

      <div class="header-actions">
        <button class="btn btn-accent btn-sm" id="login-btn">Sign In</button>
        <div class="user-menu" id="user-menu" style="display:none">
          <span class="user-name" id="user-name"></span>
          <button class="btn btn-sm btn-outline-light" id="logout-btn">Logout</button>
        </div>
      </div>

      <button class="mobile-menu-toggle" id="mobile-menu-toggle" aria-label="Toggle navigation">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="main">
    <div class="container" id="app">
      <!-- Views are rendered here by the router -->
    </div>
  </main>

  <!-- ===== AUTH MODAL ===== -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>

      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Match Play Championship</h2>
        <p class="modal-subtitle">Welcome to Bandon Dunes</p>
        <div class="modal-tabs">
          <button class="modal-tab active" id="tab-login" data-tab="login">Sign In</button>
          <button class="modal-tab" id="tab-register" data-tab="register">Register</button>
        </div>
      </div>

      <!-- Login Form -->
      <form class="auth-form" id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required>
        </div>
        <div class="form-error" id="login-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- Register Form -->
      <form class="auth-form" id="register-form" style="display:none">
        <div class="form-group">
          <label for="register-name">Full Name</label>
          <input type="text" id="register-name" class="form-input" placeholder="John Smith" required>
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" class="form-input" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" class="form-input" placeholder="Create a password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="register-handicap">Handicap Index</label>
          <input type="number" id="register-handicap" class="form-input" placeholder="e.g. 12.4" step="0.1" min="0" max="54" required>
        </div>
        <div class="form-error" id="register-error"></div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ===== SCRIPTS (loaded in dependency order) ===== -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/scorecard.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
