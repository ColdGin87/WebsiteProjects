<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bandon Dunes Retreat | Match Play Championship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand">
        <span class="title">Bandon Dunes Retreat</span>
        <span class="subtitle">Match Play Championship</span>
      </div>

      <ul class="nav-links">
        <li><a href="#dashboard" class="active">Dashboard</a></li>
        <li><a href="#leaderboard">Leaderboard</a></li>
        <li><a href="#players">Players</a></li>
      </ul>

      <div class="nav-user">
        <button class="btn-nav" id="btn-show-login">Sign In</button>
        <div id="user-menu" style="display:none">
          <span class="user-name" id="user-name"></span>
          <button class="btn-nav" id="btn-logout">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container" id="app">
    <!-- Views rendered here by the router -->
  </main>

  <!-- ===== AUTH MODAL ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h2>Match Play Championship</h2>
      <div class="modal-tabs">
        <button class="modal-tab active" id="tab-login">Sign In</button>
        <button class="modal-tab" id="tab-register">Register</button>
      </div>

      <div id="auth-error" style="color:var(--danger);font-size:0.85rem;min-height:1.2em;margin-bottom:0.5rem"></div>

      <!-- Login Form -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display:none">
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" class="form-control" placeholder="John Smith" required>
        </div>
        <div class="form-group">
          <label for="reg-email">Email</label>
          <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" class="form-control" placeholder="Create a password" required minlength="6">
        </div>
        <div class="form-group">
          <label for="reg-handicap">Handicap Index</label>
          <input type="number" id="reg-handicap" class="form-control" placeholder="e.g. 12.4" step="0.1" min="0" max="54" value="0">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
    </div>
  </div>

  <!-- ===== SCRIPTS ===== -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/scorecard.js"></script>
  <script src="js/leaderboard.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
